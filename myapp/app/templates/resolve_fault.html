{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-success text-white">
                    <h4>Resolve Fault for {{ fault.asset.name }}</h4>
                </div>
                <div class="card-body">
                    <p><strong>Reported:</strong> {{ fault.reported_date|date:"Y-m-d H:i" }}</p>
                    <p><strong>Description:</strong> {{ fault.fault_description }}</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Repair Notes</label>
                            <textarea name="repair_notes" rows="3" class="form-control"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Repair Cost (optional)</label>
                            <input type="number" step="0.01" name="repair_cost" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-success">Mark as Resolved</button>
                        <a href="{% url 'asset_detail' fault.asset.id %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
