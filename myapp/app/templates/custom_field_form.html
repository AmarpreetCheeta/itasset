{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-body p-4">
                    <div class="mb-4">
                        <h3 class="fw-bold">{{ title }}</h3>
                        <p class="text-muted">Configure custom field properties</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Save Field
                            </button>
                            <a href="{% url 'custom_field_list' %}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fieldTypeSelect = document.getElementById('id_field_type');
        const choicesField = document.getElementById('id_choices').closest('.mb-3'); // adjust class as needed
        
        function toggleChoicesField() {
            if (fieldTypeSelect.value === 'select') {
                choicesField.style.display = 'block';
            } else {
                choicesField.style.display = 'none';
            }
        }
        
        // Initial toggle
        toggleChoicesField();
        
        // Listen for changes
        fieldTypeSelect.addEventListener('change', toggleChoicesField);
    });
</script>
{% endblock %}
